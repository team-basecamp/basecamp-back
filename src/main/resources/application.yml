spring:
  application:
    name: basecamp-back

  profiles:
    active: local

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/basecamp?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  servlet:
    multipart:
      # 게시글/리뷰 이미지 업로드 상한. 초과 시 MaxUploadSizeExceededException → IMAGE_SIZE_EXCEEDED(413)
      max-file-size: ${FILE_MAX_FILE_SIZE:5MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:50MB}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      # 토큰 블랙리스트 조회 캐시. Lettuce 는 지연 연결이라 Redis 가 없어도 애플리케이션은 기동된다.
      # 조회 실패 시 필터는 fail-open(경고 로그 후 통과)하므로 로컬 개발에는 Redis 가 없어도 된다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            # 엔드포인트(token/user-info)는 CommonOAuth2Provider.GOOGLE 가 자동 제공하지만,
            # redirect-uri 는 토큰 교환에서 authorize 때와 정확히 일치해야 하므로 명시한다(미지정 시 미해석 템플릿이 전송됨).
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/oauth/google/callback}
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-client-secret}
            redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/login/oauth2/code/naver}
            authorization-grant-type: authorization_code
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-in-env-for-local-development-only}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

# gocamping API
gocamping:
  api:
    key: ${GOCAMPING_API_KEY:dummy-gocamping-api-key}
    url: https://apis.data.go.kr/B551011/GoCamping/basedList  # 고캠핑 API URL

# 카카오 주소 검색(지오코딩) API — 로그인용 client-id와 동일한 REST API 키 사용
kakao:
  local:
    api-key: ${KAKAO_REST_API_KEY:dummy-kakao-rest-api-key}

# 고캠핑 API가 가격 정보를 제공하지 않아, 신규 캠핑장 저장 시 이 범위 내에서 임의로 가격을 부여한다.
camp:
  default-price:
    min: ${CAMP_DEFAULT_PRICE_MIN:50000}
    max: ${CAMP_DEFAULT_PRICE_MAX:100000}
    unit: ${CAMP_DEFAULT_PRICE_UNIT:1000}
  # 앱 기동 시 고캠핑 API 자동 동기화(CampDataInitializer) 스위치.
  # false: 빈 자체가 등록되지 않아 동기화가 아예 실행되지 않는다. (현재 기본값 — 매 기동마다 외부 API를 호출하지 않도록)
  # true : camps 테이블이 비어 있을 때만 고캠핑 API 전체를 받아온다. 데이터가 있으면 건너뛴다.
  # 주의: CampDataInitializer 는 @ConditionalOnProperty(matchIfMissing = true) 라, 아래 키를 지우면 "켜짐"으로 되돌아간다.
  #       끄려면 반드시 false 를 명시해둘 것.
  # 데이터를 채워야 할 때는 관리자 권한으로 POST /api/v1/camps/fetch 를 호출한다.
  data:
    init:
      enabled: ${CAMP_DATA_INIT_ENABLED:false}

cors:
  # credentials 허용 CORS 오리진 화이트리스트. 배포 오리진은 환경변수로 주입 (콤마 구분).
  # 예) CORS_ALLOWED_ORIGINS=https://basecamp.example.com,https://admin.basecamp.example.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

cookie:
  # refresh 토큰 쿠키 설정. 로컬은 same-site 라 Lax/비-Secure 로 충분하지만,
  # 배포 시 프론트/백 도메인이 다르면(cross-site) SameSite=None + Secure=true 로 주입해야 한다.
  # (SameSite=None 이면 Secure=true 가 필수)
  refresh:
    name: ${COOKIE_REFRESH_NAME:refreshToken}
    path: ${COOKIE_REFRESH_PATH:/api/v1/auth}
    same-site: ${COOKIE_REFRESH_SAMESITE:Lax}
    secure: ${COOKIE_REFRESH_SECURE:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: info
    com.basecamp.backend: debug

payment:
  waiting-expiry-minutes: ${PAYMENT_WAITING_EXPIRY:30}

# 포트원(PortOne) V2 결제 연동.
# 현재는 PG사 심사를 거치지 않은 "테스트 모드" 채널을 사용. 로컬 환경이므로 웹훅은 생략
portone:
  store-id: ${PORTONE_STORE_ID:store-deaa3bf6-b7a0-41e3-ad6a-d9f6d404c1a5}
  channel-key:
    inicis: ${PORTONE_CHANNEL_KEY_INICIS:channel-key-814516fc-e895-45ba-9f1a-b2bc64d194c0}
    kakaopay: ${PORTONE_CHANNEL_KEY_KAKAOPAY:channel-key-ccff92d4-f35b-4444-996c-0072686b19ab}
    tosspay: ${PORTONE_CHANNEL_KEY_TOSSPAY:channel-key-ff7b173e-fd31-4d4c-83d7-7dcd589c68e3}
  api-secret: ${PORTONE_API_SECRET:}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}

# 이미지 저장소 (MinIO). 프로필/게시글/리뷰/캠핑장 이미지를 단일 버킷에 prefix 로 나눠 저장한다.
# 버킷은 anonymous download 정책이므로 저장된 객체의 공개 URL 을 그대로 DB 에 남긴다.
# 로컬 기동은 docker-compose.yml 의 minio 서비스 참고.
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}               # 서버 → MinIO SDK 접속 주소
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000} # 클라이언트에 노출할 주소 (DB 에 저장되는 URL 의 접두어)
  access-key: ${MINIO_ROOT_USER:basecamp}
  secret-key: ${MINIO_ROOT_PASSWORD:basecamp123}
  bucket: ${MINIO_BUCKET:basecamp}
  max-count: ${IMAGE_MAX_COUNT:10}                                # 한 요청당 첨부 이미지 최대 개수
  allowed-extensions: jpg,jpeg,png,gif,webp                       # 허용 확장자

# OpenWeatherMap API — 좌표 기반 현재 날씨/예보 조회
openweather:
  api-key: ${OPENWEATHER_API_KEY:dummy-openweather-api-key}
  current-url: https://api.openweathermap.org/data/2.5/weather
  forecast-url: https://api.openweathermap.org/data/2.5/forecast
  cache:
    region-ttl-minutes: ${OPENWEATHER_REGION_TTL:30}
