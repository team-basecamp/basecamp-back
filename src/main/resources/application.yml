spring:
  application:
    name: basecamp-back

  profiles:
    active: local

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/basecamp?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            # 엔드포인트(token/user-info)는 CommonOAuth2Provider.GOOGLE 가 자동 제공하지만,
            # redirect-uri 는 토큰 교환에서 authorize 때와 정확히 일치해야 하므로 명시한다(미지정 시 미해석 템플릿이 전송됨).
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/oauth/google/callback}
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-client-secret}
            redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/login/oauth2/code/naver}
            authorization-grant-type: authorization_code
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-in-env-for-local-development-only}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

# gocamping API
gocamping:
  api:
    key: ${GOCAMPING_API_KEY:dummy-gocamping-api-key}
    url: https://apis.data.go.kr/B551011/GoCamping/basedList  # 고캠핑 API URL

cors:
  # credentials 허용 CORS 오리진 화이트리스트. 배포 오리진은 환경변수로 주입 (콤마 구분).
  # 예) CORS_ALLOWED_ORIGINS=https://basecamp.example.com,https://admin.basecamp.example.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

cookie:
  # refresh 토큰 쿠키 설정. 로컬은 same-site 라 Lax/비-Secure 로 충분하지만,
  # 배포 시 프론트/백 도메인이 다르면(cross-site) SameSite=None + Secure=true 로 주입해야 한다.
  # (SameSite=None 이면 Secure=true 가 필수)
  refresh:
    name: ${COOKIE_REFRESH_NAME:refreshToken}
    path: ${COOKIE_REFRESH_PATH:/api/v1/auth}
    same-site: ${COOKIE_REFRESH_SAMESITE:Lax}
    secure: ${COOKIE_REFRESH_SECURE:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: info
    com.basecamp.backend: debug
