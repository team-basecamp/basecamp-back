plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.basecamp'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('jjwtVersion', '0.12.6')
	set('springdocVersion', '2.6.0')
	set('minioVersion', '8.5.17')
}

// 코드 포맷은 논쟁 대상이 아니라 도구가 정한다.
//   ./gradlew spotlessApply   포맷 적용
//   ./gradlew spotlessCheck   검증 (수동으로만)
// 임시: 다른 팀원들의 미포맷 PR 이 먼저 머지되어, 전체 포맷은 모든 코드가 합쳐진 뒤 마지막에 한 번에 적용한다.
// 그때까지 spotlessCheck 가 build 를 깨지 않도록 enforceCheck 를 꺼 둔다. 정리 시 이 한 줄만 지우면 된다.
spotless {
	enforceCheck false
	java {
		target 'src/*/java/**/*.java'
		googleJavaFormat('1.22.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

dependencies {
	// Web / Validation
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Persistence
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 토큰 블랙리스트 조회 캐시 (TTL 자동 만료). 영속 기록은 MySQL token_blacklist 가 담당.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// DB Migration
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'

	// Security / OAuth2 / JWT
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// API 문서화 (Swagger)
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// 오브젝트 스토리지 (MinIO). 프로필/게시글/리뷰/캠핑장 이미지 저장소.
	implementation "io.minio:minio:${minioVersion}"

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
